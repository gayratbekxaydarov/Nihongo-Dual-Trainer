<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Kanji Voice Trainer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="trainer-card text-center">

        <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
            <span class="fs-3">🇯🇵</span>
            <h1 class="h3 m-0 fw-bold text-white">Kanji Voice Trainer</h1>
        </div>

        <p id="introText" class="intro">
            <kbd class="bg-secondary text-white">Space</kbd> ni bosib turing va kanjini yaponcha o'qing.
        </p>

        <div class="mb-3">
            <div id="counter" class="small text-secondary mb-1">&nbsp;</div>
            <div id="kanjiDisplay" class="kanji-display mb-2">…</div>
            <div id="meaningDisplay" class="meaning-text mb-2"></div>
            <div id="heardDisplay" class="heard-text"></div>

            <div id="answerBox" class="answer-box d-none">
                <div class="small text-secondary">Hiragana va talaffuz</div>
                <div id="answerReading" class="answer-reading"></div>
                <div id="answerRomaji" class="answer-romaji"></div>
            </div>
        </div>

        <div class="d-grid mb-3">
            <button id="micBtn" class="btn btn-primary mic-btn shadow-sm" type="button" disabled>
                🎤 Yuklanmoqda...
            </button>
        </div>

        <div class="d-flex justify-content-center gap-2 mb-3">
            <button id="hearBtn" class="btn btn-outline-light btn-sm" type="button">🔊 Eshitish</button>
            <button id="skipBtn" class="btn btn-outline-light btn-sm" type="button">⏭ O'tkazib yuborish</button>
        </div>

        <div class="mb-2" aria-live="polite">
            <span id="statusText" class="badge bg-secondary status-badge">Tayyor</span>
        </div>
        <div id="hintDisplay" class="hint-text mb-1" aria-live="polite"></div>
        <div id="scoreDisplay" class="small text-secondary"></div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
