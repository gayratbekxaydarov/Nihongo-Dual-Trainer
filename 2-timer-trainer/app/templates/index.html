<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Kanji Timer Trainer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="trainer-card text-center">

        <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
            <span class="fs-3">🇯🇵</span>
            <h1 class="h3 m-0 fw-bold text-white">Kanji Timer Trainer</h1>
        </div>

        <!-- 1) Boshlang'ich sozlama -->
        <section id="setup">
            <p class="intro">Har bir kanji necha soniya ko'rinib tursin?</p>

            <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
                <input id="secondsInput" class="form-control form-control-lg seconds-input" type="number"
                       inputmode="numeric" min="1" max="600" value="5" aria-label="Soniya">
                <span class="text-secondary">soniya</span>
            </div>

            <div id="chips" class="d-flex justify-content-center flex-wrap gap-2 mb-3">
                <button type="button" class="btn btn-outline-light btn-sm chip" data-sec="3">3</button>
                <button type="button" class="btn btn-outline-light btn-sm chip" data-sec="5">5</button>
                <button type="button" class="btn btn-outline-light btn-sm chip" data-sec="8">8</button>
                <button type="button" class="btn btn-outline-light btn-sm chip" data-sec="10">10</button>
                <button type="button" class="btn btn-outline-light btn-sm chip" data-sec="15">15</button>
                <button type="button" class="btn btn-outline-light btn-sm chip" data-sec="30">30</button>
            </div>

            <label class="small text-secondary d-inline-flex align-items-center gap-2 mb-3" for="shuffleCheck">
                <input id="shuffleCheck" class="form-check-input m-0" type="checkbox" checked>
                So'zlarni aralashtirish
            </label>

            <div class="d-grid mb-2">
                <button id="startBtn" class="btn btn-primary btn-lg" type="button" disabled>▶ Boshlash</button>
            </div>
            <div id="setupHint" class="hint-text" aria-live="polite"></div>
        </section>

        <!-- 2) Faqat kanji ko'rsatiladi -->
        <section id="player" class="d-none">
            <div id="counter" class="small text-secondary mb-1">&nbsp;</div>
            <div class="kanji-stage mb-3">
                <div id="kanjiDisplay" class="kanji-big">…</div>
            </div>

            <div class="progress timer-progress mb-3" role="progressbar" aria-label="Keyingi so'zgacha vaqt">
                <div id="timerBar" class="progress-bar bg-info" style="width: 0%"></div>
            </div>

            <div class="d-flex justify-content-center gap-2 mb-3">
                <button id="prevBtn" class="btn btn-outline-light control-btn" type="button" title="Oldingi (←)">⏮</button>
                <button id="playBtn" class="btn btn-primary control-btn px-4" type="button" title="Pauza / davom (Space)">⏸</button>
                <button id="nextBtn" class="btn btn-outline-light control-btn" type="button" title="Keyingi (→)">⏭</button>
                <button id="backBtn" class="btn btn-outline-light control-btn" type="button" title="Soniyani o'zgartirish">⚙</button>
            </div>

            <div aria-live="polite">
                <span id="statusText" class="badge bg-info text-dark status-badge">Ishlayapti</span>
            </div>
        </section>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
